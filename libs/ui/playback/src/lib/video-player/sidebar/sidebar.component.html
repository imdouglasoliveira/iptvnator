@let previewChannels = preview();
<app-channel-list-container
    [channelList]="previewChannels ?? channels()"
    [managementChannels]="previewChannels ? null : managementChannels()"
    [emptyHint]="emptyHint()"
    [channelsLoading]="channelsLoading() && !previewChannels"
    [activeView]="previewChannels ? 'all' : activeView()"
    [recentItems]="activePlaylist()?.recentlyViewed ?? []"
    [sidebarWidth]="sidebarWidth()"
    (sidebarWidthRequested)="onSidebarWidthRequested($event)"
    (sidebarWidthRequestEnded)="onSidebarWidthRequestEnded($event)"
    (sidebarToggleRequested)="sidebarToggleRequested.emit()"
    (selectedGroupChange)="selectedGroupChange.emit($event)"
/>
@if (previewChannels) {
    <app-channel-list-loading-state
        view="groups"
        [groupsOnly]="true"
    />
}
